services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"

volumes:
  postgres_data: